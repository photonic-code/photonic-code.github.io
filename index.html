<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·</title>
  <style>
    :root {
      --bg: #090c0a;
      --amber: #ffb833;
      --alert: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #scope {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* CRT scanlines effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    /* Screen vignette */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 11;
    }

    /* Status lamp (top right) */
    #dot {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--amber);
      box-shadow: 0 0 12px var(--amber);
      animation: blink 1.4s infinite alternate;
      z-index: 5;
    }

    #dot.live {
      background-color: var(--alert);
      box-shadow: 0 0 14px var(--alert);
      animation-duration: 0.6s;
    }

    @keyframes blink {
      0% { opacity: 0.15; }
      100% { opacity: 0.95; }
    }

    /* Play / stop button (icon only, no text) */
    #play {
      position: fixed;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      width: 68px;
      height: 68px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #33ff66;
      background: rgba(8, 26, 12, 0.85);
      box-shadow: 0 0 14px rgba(51, 255, 102, 0.35);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      animation: invite 2s infinite;
      -webkit-tap-highlight-color: transparent;
    }

    #play:hover {
      background: rgba(51, 255, 102, 0.18);
    }

    #play .icon-play {
      width: 0;
      height: 0;
      margin-left: 6px;
      border-style: solid;
      border-width: 13px 0 13px 22px;
      border-color: transparent transparent transparent #33ff66;
      filter: drop-shadow(0 0 6px #33ff66);
    }

    #play .icon-stop {
      display: none;
      width: 22px;
      height: 22px;
      background: #ff3333;
      filter: drop-shadow(0 0 6px #ff3333);
    }

    #play.live {
      border-color: #ff3333;
      box-shadow: 0 0 14px rgba(255, 51, 51, 0.4);
      animation: none;
    }

    #play.live .icon-play { display: none; }
    #play.live .icon-stop { display: block; }

    @keyframes invite {
      0%   { box-shadow: 0 0 6px rgba(51, 255, 102, 0.25), 0 0 0 0 rgba(51, 255, 102, 0.35); }
      70%  { box-shadow: 0 0 14px rgba(51, 255, 102, 0.45), 0 0 0 16px rgba(51, 255, 102, 0); }
      100% { box-shadow: 0 0 6px rgba(51, 255, 102, 0.25), 0 0 0 0 rgba(51, 255, 102, 0); }
    }
  </style>
</head>
<body>

  <canvas id="scope"></canvas>
  <div id="dot"></div>
  <button id="play" type="button"><span class="icon-play"></span><span class="icon-stop"></span></button>

  <script>
    // Tap anywhere to start / stop. No text is shown on screen.
    const WORDS = atob("R09MRixFQ0hPLE5PVkVNQkVSLEVDSE8sU0lFUlJBLElORElBLFNJRVJSQQ==").split(",");
    const CYCLE_PAUSE_MS = 5000;   // silence between repeats

    let audioCtx = null;
    let isPlaying = false;
    let speaking = false;          // true while a word is being read
    let beepUntil = 0;             // visual boost while a beep sounds
    let tuneStart = 0;             // when the "carrier lock" sweep began
    let runId = 0;                 // changes on every start/stop to cancel old loops
    let noiseNode = null;
    const dot = document.getElementById('dot');
    const playBtn = document.getElementById('play');

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    /* ---------------- Audio ---------------- */

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 800, duration = 0.25) {
      if (!audioCtx) return;
      beepUntil = performance.now() + duration * 1000;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startRadioNoise() {
      if (!audioCtx || noiseNode) return;
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;

      // Bandpass filter for shortwave radio hiss
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1400;
      filter.Q.value = 1.2;

      const gain = audioCtx.createGain();
      gain.gain.value = 0.035;

      noiseNode.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noiseNode.start();
    }

    function stopRadioNoise() {
      if (noiseNode) {
        try { noiseNode.stop(); } catch (e) {}
        noiseNode = null;
      }
    }

    function speakWord(word, id) {
      return new Promise((resolve) => {
        if (id !== runId) return resolve();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.85;    // deliberate, calm cadence
        utter.pitch = 0.82;   // slightly deeper, cold operator tone

        const voices = window.speechSynthesis.getVoices();
        const engVoice = voices.find(v => v.lang.startsWith('en') &&
          (v.name.includes('Natural') || v.name.includes('Google') ||
           v.name.includes('Samantha') || v.name.includes('Alex')));
        if (engVoice) utter.voice = engVoice;

        utter.onend = () => { speaking = false; setTimeout(resolve, 600); };
        utter.onerror = () => { speaking = false; resolve(); };
        speaking = true;
        window.speechSynthesis.speak(utter);
      });
    }

    async function startTransmission() {
      initAudio();
      isPlaying = true;
      const id = ++runId;
      dot.classList.add('live');
      playBtn.classList.add('live');
      tuneStart = performance.now();
      startRadioNoise();

      while (id === runId) {
        playBeep(920, 0.3);
        await sleep(400);
        playBeep(920, 0.3);
        await sleep(700);

        for (let i = 0; i < WORDS.length; i++) {
          if (id !== runId) break;
          await speakWord(WORDS[i], id);
        }

        if (id !== runId) break;
        playBeep(460, 0.6);
        await sleep(CYCLE_PAUSE_MS);
        tuneStart = performance.now();   // short re-lock sweep on each cycle
      }
    }

    function stopTransmission() {
      runId++;
      isPlaying = false;
      speaking = false;
      window.speechSynthesis.cancel();
      stopRadioNoise();
      dot.classList.remove('live');
      playBtn.classList.remove('live');
    }

    function toggle() {
      if (isPlaying) stopTransmission();
      else startTransmission();
    }

    // Button toggles; tapping elsewhere on the screen works too.
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();   // avoid firing the body handler a second time
      toggle();
    });
    document.body.addEventListener('click', toggle);

    if (typeof window.speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    /* ---------------- Visuals (no text) ---------------- */

    const canvas = document.getElementById('scope');
    const ctx = canvas.getContext('2d');
    let dpr = 1, W = 0, H = 0;

    // small offscreen canvas for TV-static noise
    const nW = 160, nH = 90;
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = nW;
    noiseCanvas.height = nH;
    const nctx = noiseCanvas.getContext('2d');
    const nImg = nctx.createImageData(nW, nH);

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.floor(window.innerWidth * dpr);
      H = canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.fillStyle = '#090c0a';
      ctx.fillRect(0, 0, W, H);
    }
    window.addEventListener('resize', resize);
    resize();

    const BARS = 32;
    const bars = new Array(BARS).fill(0);
    let level = 0.05;              // smoothed activity 0..1
    let sigLit = 1;
    let lastSig = 0;
    let frame = 0;

    function drawNoise() {
      const d = nImg.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = 0;
        d[i + 1] = v;
        d[i + 2] = v * 0.35;
        d[i + 3] = 255;
      }
      nctx.putImageData(nImg, 0, 0);
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = isPlaying ? (speaking ? 0.11 : 0.08) : 0.035;
      ctx.drawImage(noiseCanvas, 0, 0, W, H);
      ctx.restore();
    }

    function draw(now) {
      frame++;

      // ---- activity level ----
      let target = 0.05;
      if (isPlaying) {
        target = speaking ? 1.0 : 0.3;
        if (now < beepUntil) target = Math.max(target, 0.75);
      }
      level += (target - level) * 0.18;

      // ---- phosphor persistence (fade instead of clear) ----
      ctx.fillStyle = 'rgba(9, 12, 10, 0.30)';
      ctx.fillRect(0, 0, W, H);

      if (frame % 2 === 0) drawNoise();

      const green = isPlaying ? '#33ff66' : '#1a7a33';
      const dim = isPlaying ? 'rgba(51,255,102,0.18)' : 'rgba(26,122,51,0.16)';

      // ---- faint grid ----
      ctx.lineWidth = 1 * dpr;
      ctx.strokeStyle = dim;
      ctx.beginPath();
      const cols = 12, rows = 8;
      for (let i = 1; i < cols; i++) {
        const x = (W / cols) * i;
        ctx.moveTo(x, H * 0.12);
        ctx.lineTo(x, H * 0.62);
      }
      for (let j = 0; j <= 4; j++) {
        const y = H * 0.12 + (H * 0.5 / 4) * j;
        ctx.moveTo(W * 0.06, y);
        ctx.lineTo(W * 0.94, y);
      }
      ctx.stroke();

      // ---- waveform ----
      const cy = H * 0.37;
      const x0 = W * 0.06, wW = W * 0.88;
      const N = 140;
      const amp = level * H * 0.2 + 1.5 * dpr;
      const t = now * 0.012;
      ctx.save();
      ctx.shadowColor = green;
      ctx.shadowBlur = (isPlaying ? 10 : 3) * dpr;
      ctx.strokeStyle = green;
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const k = i / N;
        const env = Math.sin(Math.PI * k);               // taper at both ends
        const s = Math.sin(k * 26 + t) * 0.55 +
                  Math.sin(k * 61 - t * 1.7) * 0.25 +
                  (Math.random() - 0.5) * 0.9;
        const x = x0 + wW * k;
        const y = cy + s * amp * (0.35 + 0.65 * env);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- frequency bars ----
      const bBase = H * 0.62;
      const bMax = H * 0.14;
      const gap = wW / BARS;
      ctx.save();
      ctx.fillStyle = green;
      ctx.shadowColor = green;
      ctx.shadowBlur = (isPlaying ? 6 : 0) * dpr;
      for (let i = 0; i < BARS; i++) {
        const shape = 1 - (i / BARS) * 0.55;
        const tgt = level * (0.25 + Math.random() * 0.75) * shape;
        bars[i] += (tgt - bars[i]) * 0.3;
        const h = Math.max(2 * dpr, bars[i] * bMax);
        const bx = x0 + gap * i + gap * 0.18;
        ctx.fillRect(bx, bBase - h, gap * 0.64, h);
      }
      ctx.restore();

      // ---- tuning dial ----
      const dY = H * 0.78;
      ctx.strokeStyle = isPlaying ? 'rgba(51,255,102,0.7)' : 'rgba(26,122,51,0.7)';
      ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(x0, dY);
      ctx.lineTo(x0 + wW, dY);
      const ticks = 60;
      for (let i = 0; i <= ticks; i++) {
        const x = x0 + (wW / ticks) * i;
        const len = (i % 10 === 0 ? 16 : (i % 5 === 0 ? 11 : 6)) * dpr;
        ctx.moveTo(x, dY);
        ctx.lineTo(x, dY - len);
      }
      ctx.stroke();

      // needle: sweeps in from the left while locking on, then drifts slightly
      let needleK = 0.5 + Math.sin(now * 0.0013) * 0.004;
      if (isPlaying) {
        const p = Math.min(1, (now - tuneStart) / 1100);
        const ease = 1 - Math.pow(1 - p, 3);
        needleK = 0.12 + (0.5 - 0.12) * ease + (1 - p) * Math.sin(now * 0.03) * 0.02;
      } else {
        needleK = 0.5 + Math.sin(now * 0.0013) * 0.01;
      }
      const nx = x0 + wW * needleK;
      ctx.save();
      ctx.strokeStyle = isPlaying ? '#ff3333' : '#ffb833';
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 10 * dpr;
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      ctx.moveTo(nx, dY - 24 * dpr);
      ctx.lineTo(nx, dY + 10 * dpr);
      ctx.stroke();
      ctx.restore();

      // ---- signal strength (top left) ----
      if (now - lastSig > 260) {
        lastSig = now;
        sigLit = isPlaying
          ? Math.max(2, Math.min(5, 4 + Math.round((Math.random() - 0.5) * 2)))
          : (Math.random() < 0.15 ? 2 : 1);
      }
      const sbW = 7 * dpr, sbGap = 4 * dpr, sbX = 22 * dpr, sbY = 32 * dpr;
      for (let i = 0; i < 5; i++) {
        const h = (6 + i * 5) * dpr;
        ctx.fillStyle = i < sigLit ? (isPlaying ? '#33ff66' : '#1a7a33') : 'rgba(51,255,102,0.12)';
        ctx.fillRect(sbX + i * (sbW + sbGap), sbY - h + 12 * dpr, sbW, h);
      }

      // ---- horizontal sweep band + occasional glitch ----
      const bandY = ((now * 0.06) % (H + 120 * dpr)) - 60 * dpr;
      const grad = ctx.createLinearGradient(0, bandY - 40 * dpr, 0, bandY + 40 * dpr);
      grad.addColorStop(0, 'rgba(51,255,102,0)');
      grad.addColorStop(0.5, isPlaying ? 'rgba(51,255,102,0.07)' : 'rgba(51,255,102,0.025)');
      grad.addColorStop(1, 'rgba(51,255,102,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, bandY - 40 * dpr, W, 80 * dpr);

      if (isPlaying && Math.random() < (speaking ? 0.06 : 0.025)) {
        const gy = Math.random() * H;
        const gh = (2 + Math.random() * 10) * dpr;
        ctx.fillStyle = 'rgba(51,255,102,0.16)';
        ctx.fillRect(0, gy, W, gh);
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
